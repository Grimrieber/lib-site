name: Hourly snapshot refresh

# Runs hourly: pulls /api/snapshot-export every hour and /api/snapshot-enrichments
# whenever the committed enrichments have gone stale (staleness-gated, see below),
# then commits the result to data/snapshot.json. That file is the persistent
# fallback the live site uses when a fresh RIO/BNet fetch fails or returns a
# partial response.
#
# Setup: repo secret CRON_SECRET must match the same env var in Vercel.

on:
  schedule:
    # Every 2 hours at :17. Aligned with the 2h active-staleness cap
    # (ENRICH_ACTIVE_MAX_STALENESS_MS) — hourly builds were redundant since an
    # active player only re-fetches every ~2h anyway, so this ~halves build CPU
    # for the same freshness. :17 (not :00) dodges the busiest GH/Vercel/RIO
    # minute. The active-hours gate below drops the overnight (2-8am Central,
    # CST/UTC-6) slots, leaving ~9 runs/day (14,16,18,20,22,00,02,04,06 UTC =
    # 8am-midnight Central; the even-hour grid can't reach the 2am tail).
    - cron: "17 */2 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Headroom for the longer per-call curl ceilings (snapshot 185s, enrichments
    # 310s, ×3 attempts). Normal runs finish in ~1-2min; this only bounds the
    # pathological all-timeout case so it can't be killed mid-commit/push.
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      # Active-hours gate. Skip the whole refresh during 08:00-14:00 UTC
      # (~2-8am Central, CST): nobody's raiding or reading the site, so there's no
      # point spending Vercel Active CPU (snapshot-export + announce) or
      # triggering a redeploy. The window straddles NEITHER enrichment slot
      # (03:00 / 15:00 UTC), so the twice-daily heavy runs are untouched. Every
      # downstream step is gated on `active` so even the announce POST (which
      # would otherwise fire because data/snapshot.json always exists in the
      # checkout) is skipped. A manual workflow_dispatch always runs.
      - name: Active-hours gate
        id: window
        run: |
          HOUR=$(date -u +%H)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] \
             && { [ "$HOUR" = "08" ] || [ "$HOUR" = "09" ] || [ "$HOUR" = "10" ] \
               || [ "$HOUR" = "11" ] || [ "$HOUR" = "12" ] || [ "$HOUR" = "13" ]; }; then
            echo "Dead window ($HOUR:00 UTC ~ 2-8am CST) — skipping refresh."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "Active hour ($HOUR:00 UTC) — running refresh."
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.active == 'true'
        uses: actions/checkout@v5

      # NOTE: the old "Warm cache via /api/refresh" step was removed.
      # /api/refresh ran the full *ungated* enrichments fanout PLUS a
      # 64-character BNet achievements warmup every hour — ~37s of Active
      # CPU per run (~5 of every 7 minutes of the site's total). It existed
      # to prime an in-memory module cache, but since character pages are
      # ISR-cached they regenerate in their own invocations and never read
      # that cache, so the warmup was burning CPU for nothing. The snapshot
      # is built entirely by the lite/gated steps below.

      - name: Pull snapshot + enrichments
        if: steps.window.outputs.active == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          mkdir -p data tmp

          # The snapshot generation used to be a single ~50-90s call that
          # combined RIO roster fetches with the BNet enrichments fanout.
          # That blew through Vercel Hobby's 60s function-timeout cap on
          # scheduled runs during peak. Now split into two smaller calls,
          # each well under 60s on its own:
          #
          #   1. /api/snapshot-export?lite=1&merge=1  → roster, tiers, runs
          #   2. /api/snapshot-enrichments            → BNet enrichments
          #
          # Both retry up to 3 times with 30s backoff for transient flakes.
          # Then jq merges the two JSONs into data/snapshot.json.

          # max_time MUST exceed the route's own Vercel maxDuration (see
          # vercel.json): snapshot-export=180s, snapshot-enrichments=300s.
          # If curl gives up BEFORE the function's cap, it abandons a healthy
          # but slow run — and then fires a second attempt while the first is
          # STILL running and billing Active CPU on Vercel. That double-billed
          # ~33% of snapshot-export invocations (16 calls/12h vs the 12 the
          # hourly cron should produce). Waiting past the function cap means a
          # retry only fires on a genuine failure (--fail returns immediately
          # on any 4xx/5xx, so real failures still retry fast).
          fetch_with_retry() {
            local url="$1"
            local out="$2"
            local label="$3"
            local max_time="${4:-185}"
            for attempt in 1 2 3; do
              echo "::group::$label attempt $attempt/3 (max-time ${max_time}s)"
              if curl --fail --silent --show-error --max-time "$max_time" \
                  -H "Authorization: Bearer $CRON_SECRET" \
                  "$url" \
                  -o "$out"; then
                echo "$label succeeded on attempt $attempt"
                echo "::endgroup::"
                return 0
              fi
              echo "$label attempt $attempt failed"
              echo "::endgroup::"
              [ $attempt -lt 3 ] && sleep 30
            done
            return 1
          }

          if ! fetch_with_retry \
              "https://lib-site.vercel.app/api/snapshot-export?merge=1&lite=1" \
              tmp/snapshot.json \
              "Snapshot"; then
            echo "All snapshot attempts failed."
            exit 1
          fi

          # Enrichments — the BNet /achievements fanout (tier badges, season
          # titles, recent-achievements feed) — is the heaviest part of the
          # refresh. With the Upstash tier-cache gating the per-char parse it's
          # now ~17s (only changed chars re-fetch), but we still don't run it
          # every hour. Gate on STALENESS, not wall-clock: refresh whenever the
          # committed enrichments are older than ENRICH_MAX_AGE_H, regardless of
          # the hour. (The old "exact hour 03/15 UTC" window kept getting stepped
          # over in the GH-cron/local-fallback handoff — neither reliably fired
          # during those hours — which froze the achievements feed for days.) The
          # fresh endpoint stamps exportedAt; we persist it as
          # .enrichmentsExportedAt and carry it forward untouched on the cheap
          # hours. A manual workflow_dispatch always refreshes. The hourly Job-1
          # numbers, the Discord #guild-feed, and the Resilient celebration are
          # NOT affected — those come from snapshot-export and the snapshot.
          ENRICH_MAX_AGE_H=8
          PREV_MARKER=$(git show HEAD:data/snapshot.json 2>/dev/null | jq -r '.enrichmentsExportedAt // empty')
          NEED_ENRICH=1
          if [ -n "$PREV_MARKER" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            PREV_EPOCH=$(date -u -d "$PREV_MARKER" +%s 2>/dev/null || echo 0)
            AGE_H=$(( ($(date -u +%s) - PREV_EPOCH) / 3600 ))
            if [ "$PREV_EPOCH" -gt 0 ] && [ "$AGE_H" -lt "$ENRICH_MAX_AGE_H" ]; then
              NEED_ENRICH=0
              echo "Enrichments ${AGE_H}h old (< ${ENRICH_MAX_AGE_H}h) — carrying forward."
            else
              echo "Enrichments ${AGE_H}h old (>= ${ENRICH_MAX_AGE_H}h) — refreshing live."
            fi
          else
            echo "No enrichments marker or manual dispatch — refreshing live."
          fi

          ENRICH_MARKER="$PREV_MARKER"
          if [ "$NEED_ENRICH" = "1" ]; then
            if fetch_with_retry \
                "https://lib-site.vercel.app/api/snapshot-enrichments" \
                tmp/enrichments.json \
                "Enrichments" \
                310; then
              ENRICH_MARKER=$(jq -r '.exportedAt // empty' tmp/enrichments.json)
            else
              echo "Enrichments refresh failed; carrying forward the previous committed set."
              git show HEAD:data/snapshot.json > tmp/enrichments.json 2>/dev/null || echo '{}' > tmp/enrichments.json
            fi
          else
            git show HEAD:data/snapshot.json > tmp/enrichments.json 2>/dev/null || echo '{}' > tmp/enrichments.json
          fi

          # Merge: new snapshot (.[0]) + enrichments (.[1]) + the persisted
          # marker. The enrichments source is EITHER the fresh endpoint response
          # OR the previously committed data/snapshot.json — both expose
          # .enrichedRoster and .recentAchievements at the top level, so one jq
          # handles both. ENRICH_MARKER is the fresh exportedAt or the carried
          # value; empty → null. `// []` keeps the merge from emitting nulls.
          jq -s --arg marker "$ENRICH_MARKER" \
            '.[0] + {enrichedRoster: (.[1].enrichedRoster // []), recentAchievements: (.[1].recentAchievements // []), enrichmentsExportedAt: ($marker | if . == "" then null else . end)}' \
            tmp/snapshot.json tmp/enrichments.json > data/snapshot.json

          # Sanity: don't commit a garbage snapshot over a good one.
          ROSTER_LEN=$(jq '.snapshot.roster | length' data/snapshot.json)
          PREV_LEN=$(git show HEAD:data/snapshot.json 2>/dev/null | jq '.snapshot.roster | length' 2>/dev/null || echo 0)
          echo "Fetched roster length: $ROSTER_LEN (previous: $PREV_LEN)"
          if [ "$ROSTER_LEN" -lt 20 ]; then
            echo "Suspiciously small roster ($ROSTER_LEN); skipping commit."
            git checkout -- data/snapshot.json
            exit 0
          fi
          # Don't accept a noticeably smaller roster than the previous
          # good snapshot — would be a regression. 5-member tolerance
          # absorbs legitimate small turnover.
          if [ "$PREV_LEN" -gt 0 ] && [ "$ROSTER_LEN" -lt "$((PREV_LEN - 5))" ]; then
            echo "Fetched roster ($ROSTER_LEN) is smaller than previous ($PREV_LEN) by more than 5; skipping commit."
            git checkout -- data/snapshot.json
            exit 0
          fi
          rm -rf tmp

      - name: Commit + push if changed
        if: steps.window.outputs.active == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          if git diff --staged --quiet; then
            echo "No changes to data/snapshot.json"
            exit 0
          fi
          git commit -m "data: hourly snapshot refresh [skip-deploy]"
          # Retry loop: between checkout and now, a developer push to main
          # can land, leaving this branch behind. Rebase the snapshot commit
          # on top of origin/main and push. Bounded retries handle the tiny
          # race window where another push lands mid-rebase.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            echo "Push attempt $attempt failed; rebasing and retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "All 3 push attempts failed — main is changing too quickly."
          exit 1

      - name: Announce new milestones
        # POST the freshly-built snapshot to /api/announce so it diffs against
        # its Upstash baseline and posts any new kills / records / PBs /
        # Resilient tiers to #guild-feed. Passing the file directly (vs a bare
        # GET) means the announce doesn't have to wait for Vercel to redeploy
        # with the new snapshot. Reuses CRON_SECRET (the route accepts it as a
        # fallback). Stays silent until the feed has been seeded once via
        # ?mode=seed. Non-fatal: continue-on-error so a hiccup here never breaks
        # the refresh, and it only runs when the snapshot steps succeeded.
        if: success() && steps.window.outputs.active == 'true'
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ ! -f data/snapshot.json ]; then
            echo "No snapshot file; skipping announce."
            exit 0
          fi
          curl --silent --show-error --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @data/snapshot.json \
            -w "\nannounce HTTP %{http_code}\n" \
            "https://lib-site.vercel.app/api/announce" \
            || echo "announce failed (non-fatal)"

      - name: Daily moo (#only-moo)
        # Ping /api/moo on EVERY active run — no hour check here. The route owns
        # the windowing: it posts at most one cow per daily window (15:00 / 23:00
        # UTC) and, crucially, CATCHES UP a window that no runner hit on the hour.
        # The old "$HOUR == 15/23" gate silently lost the cow whenever both the
        # local PC was off AND GitHub delayed its :17 schedule past the hour
        # boundary (a run landing at 16:xx saw HOUR=16 and skipped). Pinging every
        # active run + server-side dedup removes that fragility. Non-fatal.
        if: steps.window.outputs.active == 'true'
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nmoo HTTP %{http_code}\n" \
            "https://lib-site.vercel.app/api/moo" \
            || echo "moo failed (non-fatal)"

      - name: Moo events (#only-moo deaths + achievements)
        # EVERY active run (not just the moo hours): ping /api/moo-events so new
        # deaths / achievements post as soon as we detect them. The route diffs
        # against its Upstash baseline, so it posts only genuinely-new events —
        # this AND the local task can both fire and the baseline dedupes (no
        # double-post; they run ~34min apart). Non-fatal.
        if: steps.window.outputs.active == 'true'
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nmoo-events HTTP %{http_code}\n" \
            "https://lib-site.vercel.app/api/moo-events" \
            || echo "moo-events failed (non-fatal)"

      - name: Refresh character sheets
        # Precompute each character's sheet detail into Redis so the character
        # page READS it instead of live-fetching (the live cold fanout was
        # intermittently 500ing the on-demand ISR generation — "this page
        # couldn't load"). Incremental: the route re-fetches ONLY characters RIO
        # re-crawled since last run, so steady-state cost is a few characters,
        # not the whole roster. Non-fatal; runs every active hour. The one-time
        # full backfill is done out-of-band via ?force=1, not here.
        if: steps.window.outputs.active == 'true'
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --silent --show-error --max-time 290 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\ndetails HTTP %{http_code}\n" \
            "https://lib-site.vercel.app/api/snapshot-details" \
            || echo "character-sheet refresh failed (non-fatal)"

      - name: Notify Discord on failure
        # Fires only if any earlier step failed (warmup is continue-on-error
        # so a 504 there doesn't trip this). Posts a link to the failed run
        # so you can pop straight into the log.
        #
        # Setup: create a dedicated Discord webhook on an admin/alerts
        # channel and add it as repo secret DISCORD_WEBHOOK_CRON_ALERT.
        # Without that secret, this step is a no-op (logs and exits).
        if: failure()
        env:
          DISCORD_WEBHOOK_CRON_ALERT: ${{ secrets.DISCORD_WEBHOOK_CRON_ALERT }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_CRON_ALERT" ]; then
            echo "DISCORD_WEBHOOK_CRON_ALERT not configured; skipping Discord notify."
            exit 0
          fi
          LOG_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(jq -n \
            --arg url "$LOG_URL" \
            --arg trigger "${{ github.event_name }}" \
            '{content: ("⚠️ Hourly snapshot refresh failed (\($trigger)). View log: " + $url)}')
          curl --silent --show-error --max-time 30 \
            -X POST "$DISCORD_WEBHOOK_CRON_ALERT" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Discord notify failed (non-fatal)"
