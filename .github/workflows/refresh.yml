name: Hourly snapshot refresh

# Runs hourly: hits /api/refresh to warm caches, then pulls
# /api/snapshot-export and commits the result to data/snapshot.json.
# That file is the persistent fallback the live site uses when a fresh
# RIO/BNet fetch fails or returns a partial response.
#
# Setup: repo secret CRON_SECRET must match the same env var in Vercel.

on:
  schedule:
    # :17 of the hour — off-peak. The :00 slot is the busiest minute
    # on GitHub Actions (everyone schedules there by default), and
    # also the busiest minute on Vercel/RIO/BNet from cascading load.
    # Shifting 17 minutes out of phase gets us through cleanly.
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Warm cache via /api/refresh
        # Best-effort cache prime — the BNet warmup fanout often pushes
        # /api/refresh past Vercel Hobby's 60s function-timeout cap and
        # returns 504. That's fine; it doesn't gate the snapshot generation
        # below. continue-on-error keeps a slow warmup from killing the
        # whole workflow.
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://lib-site.vercel.app/api/refresh

      - name: Pull snapshot + enrichments
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          mkdir -p data tmp

          # The snapshot generation used to be a single ~50-90s call that
          # combined RIO roster fetches with the BNet enrichments fanout.
          # That blew through Vercel Hobby's 60s function-timeout cap on
          # scheduled runs during peak. Now split into two smaller calls,
          # each well under 60s on its own:
          #
          #   1. /api/snapshot-export?lite=1&merge=2  → roster, tiers, runs
          #   2. /api/snapshot-enrichments            → BNet enrichments
          #
          # Both retry up to 3 times with 30s backoff for transient flakes.
          # Then jq merges the two JSONs into data/snapshot.json.

          fetch_with_retry() {
            local url="$1"
            local out="$2"
            local label="$3"
            for attempt in 1 2 3; do
              echo "::group::$label attempt $attempt/3"
              if curl --fail --silent --show-error --max-time 90 \
                  -H "Authorization: Bearer $CRON_SECRET" \
                  "$url" \
                  -o "$out"; then
                echo "$label succeeded on attempt $attempt"
                echo "::endgroup::"
                return 0
              fi
              echo "$label attempt $attempt failed"
              echo "::endgroup::"
              [ $attempt -lt 3 ] && sleep 30
            done
            return 1
          }

          if ! fetch_with_retry \
              "https://lib-site.vercel.app/api/snapshot-export?merge=2&lite=1" \
              tmp/snapshot.json \
              "Snapshot"; then
            echo "All snapshot attempts failed."
            exit 1
          fi

          if ! fetch_with_retry \
              "https://lib-site.vercel.app/api/snapshot-enrichments" \
              tmp/enrichments.json \
              "Enrichments"; then
            echo "All enrichments attempts failed."
            exit 1
          fi

          # Merge the two payloads into data/snapshot.json. The snapshot
          # response already has exportedAt/mergeCount/rosterSize/snapshot;
          # we splice in enrichedRoster and recentAchievements from the
          # enrichments response so the committed file matches the shape
          # the bundled JSON code expects.
          jq -s '.[0] + {enrichedRoster: .[1].enrichedRoster, recentAchievements: .[1].recentAchievements}' \
            tmp/snapshot.json tmp/enrichments.json > data/snapshot.json

          # Sanity: don't commit a garbage snapshot over a good one.
          ROSTER_LEN=$(jq '.snapshot.roster | length' data/snapshot.json)
          PREV_LEN=$(git show HEAD:data/snapshot.json 2>/dev/null | jq '.snapshot.roster | length' 2>/dev/null || echo 0)
          echo "Fetched roster length: $ROSTER_LEN (previous: $PREV_LEN)"
          if [ "$ROSTER_LEN" -lt 20 ]; then
            echo "Suspiciously small roster ($ROSTER_LEN); skipping commit."
            git checkout -- data/snapshot.json
            exit 0
          fi
          # Don't accept a noticeably smaller roster than the previous
          # good snapshot — would be a regression. 5-member tolerance
          # absorbs legitimate small turnover.
          if [ "$PREV_LEN" -gt 0 ] && [ "$ROSTER_LEN" -lt "$((PREV_LEN - 5))" ]; then
            echo "Fetched roster ($ROSTER_LEN) is smaller than previous ($PREV_LEN) by more than 5; skipping commit."
            git checkout -- data/snapshot.json
            exit 0
          fi
          rm -rf tmp

      - name: Commit + push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          if git diff --staged --quiet; then
            echo "No changes to data/snapshot.json"
            exit 0
          fi
          git commit -m "data: hourly snapshot refresh [skip-deploy]"
          git push

      - name: Notify Discord on failure
        # Fires only if any earlier step failed (warmup is continue-on-error
        # so a 504 there doesn't trip this). Posts a link to the failed run
        # so you can pop straight into the log.
        #
        # Setup: create a dedicated Discord webhook on an admin/alerts
        # channel and add it as repo secret DISCORD_WEBHOOK_CRON_ALERT.
        # Without that secret, this step is a no-op (logs and exits).
        if: failure()
        env:
          DISCORD_WEBHOOK_CRON_ALERT: ${{ secrets.DISCORD_WEBHOOK_CRON_ALERT }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_CRON_ALERT" ]; then
            echo "DISCORD_WEBHOOK_CRON_ALERT not configured; skipping Discord notify."
            exit 0
          fi
          LOG_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(jq -n \
            --arg url "$LOG_URL" \
            --arg trigger "${{ github.event_name }}" \
            '{content: ("⚠️ Hourly snapshot refresh failed (\($trigger)). View log: " + $url)}')
          curl --silent --show-error --max-time 30 \
            -X POST "$DISCORD_WEBHOOK_CRON_ALERT" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Discord notify failed (non-fatal)"
