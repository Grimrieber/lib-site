name: Hourly snapshot refresh

# Runs hourly: hits /api/refresh to warm caches, then pulls
# /api/snapshot-export and commits the result to data/snapshot.json.
# That file is the persistent fallback the live site uses when a fresh
# RIO/BNet fetch fails or returns a partial response.
#
# Setup: repo secret CRON_SECRET must match the same env var in Vercel.

on:
  schedule:
    # :17 of the hour — off-peak. The :00 slot is the busiest minute
    # on GitHub Actions (everyone schedules there by default), and
    # also the busiest minute on Vercel/RIO/BNet from cascading load.
    # Shifting 17 minutes out of phase gets us through cleanly.
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Warm cache via /api/refresh
        # Best-effort cache prime — the BNet warmup fanout often pushes
        # /api/refresh past Vercel Hobby's 60s function-timeout cap and
        # returns 504. That's fine; it doesn't gate the snapshot generation
        # below. continue-on-error keeps a slow warmup from killing the
        # whole workflow.
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://lib-site.vercel.app/api/refresh

      - name: Pull snapshot + enrichments
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          mkdir -p data tmp

          # The snapshot generation used to be a single ~50-90s call that
          # combined RIO roster fetches with the BNet enrichments fanout.
          # That blew through Vercel Hobby's 60s function-timeout cap on
          # scheduled runs during peak. Now split into two smaller calls,
          # each well under 60s on its own:
          #
          #   1. /api/snapshot-export?lite=1&merge=1  → roster, tiers, runs
          #   2. /api/snapshot-enrichments            → BNet enrichments
          #
          # Both retry up to 3 times with 30s backoff for transient flakes.
          # Then jq merges the two JSONs into data/snapshot.json.

          fetch_with_retry() {
            local url="$1"
            local out="$2"
            local label="$3"
            for attempt in 1 2 3; do
              echo "::group::$label attempt $attempt/3"
              if curl --fail --silent --show-error --max-time 90 \
                  -H "Authorization: Bearer $CRON_SECRET" \
                  "$url" \
                  -o "$out"; then
                echo "$label succeeded on attempt $attempt"
                echo "::endgroup::"
                return 0
              fi
              echo "$label attempt $attempt failed"
              echo "::endgroup::"
              [ $attempt -lt 3 ] && sleep 30
            done
            return 1
          }

          if ! fetch_with_retry \
              "https://lib-site.vercel.app/api/snapshot-export?merge=1&lite=1" \
              tmp/snapshot.json \
              "Snapshot"; then
            echo "All snapshot attempts failed."
            exit 1
          fi

          # Enrichments (the BNet /achievements fanout: tier badges, season
          # titles, recent-achievements feed) is the heaviest part of the
          # refresh — it parses BNet's ~2.67MB achievements blob for all ~64
          # characters (~107s). The data it produces changes only a handful of
          # times a year, so we refresh it just TWICE a day instead of hourly:
          #   03:00 UTC  ≈ 10pm Central (post-raid sweep)
          #   15:00 UTC  ≈ 10am Central (morning sweep)
          # Every other hour we carry forward the enrichments already committed
          # in data/snapshot.json. NOTE: the hourly Job-1 numbers (ilvl, score,
          # runs, raid progress), the Discord #guild-feed, and the Resilient
          # celebration are NOT affected — those come from snapshot-export and
          # the snapshot itself, which still refresh every hour.
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "03" ] || [ "$HOUR" = "15" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Enrichment window ($HOUR:00 UTC) — refreshing enrichments live."
            if ! fetch_with_retry \
                "https://lib-site.vercel.app/api/snapshot-enrichments" \
                tmp/enrichments.json \
                "Enrichments"; then
              echo "Enrichments refresh failed; carrying forward the previous committed set."
              git show HEAD:data/snapshot.json > tmp/enrichments.json 2>/dev/null || echo '{}' > tmp/enrichments.json
            fi
          else
            echo "Off-window ($HOUR:00 UTC) — carrying forward committed enrichments (next refresh at 03:00/15:00 UTC)."
            git show HEAD:data/snapshot.json > tmp/enrichments.json 2>/dev/null || echo '{}' > tmp/enrichments.json
          fi

          # Merge: new snapshot (.[0]) + enrichments (.[1]). The enrichments
          # source is EITHER the fresh endpoint response OR the previously
          # committed data/snapshot.json — both expose .enrichedRoster and
          # .recentAchievements at the top level, so one jq handles both. The
          # `// []` fallback keeps the merge from emitting nulls if a field is
          # somehow absent (e.g. a very old committed snapshot).
          jq -s '.[0] + {enrichedRoster: (.[1].enrichedRoster // []), recentAchievements: (.[1].recentAchievements // [])}' \
            tmp/snapshot.json tmp/enrichments.json > data/snapshot.json

          # Sanity: don't commit a garbage snapshot over a good one.
          ROSTER_LEN=$(jq '.snapshot.roster | length' data/snapshot.json)
          PREV_LEN=$(git show HEAD:data/snapshot.json 2>/dev/null | jq '.snapshot.roster | length' 2>/dev/null || echo 0)
          echo "Fetched roster length: $ROSTER_LEN (previous: $PREV_LEN)"
          if [ "$ROSTER_LEN" -lt 20 ]; then
            echo "Suspiciously small roster ($ROSTER_LEN); skipping commit."
            git checkout -- data/snapshot.json
            exit 0
          fi
          # Don't accept a noticeably smaller roster than the previous
          # good snapshot — would be a regression. 5-member tolerance
          # absorbs legitimate small turnover.
          if [ "$PREV_LEN" -gt 0 ] && [ "$ROSTER_LEN" -lt "$((PREV_LEN - 5))" ]; then
            echo "Fetched roster ($ROSTER_LEN) is smaller than previous ($PREV_LEN) by more than 5; skipping commit."
            git checkout -- data/snapshot.json
            exit 0
          fi
          rm -rf tmp

      - name: Commit + push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          if git diff --staged --quiet; then
            echo "No changes to data/snapshot.json"
            exit 0
          fi
          git commit -m "data: hourly snapshot refresh [skip-deploy]"
          # Retry loop: between checkout and now, a developer push to main
          # can land, leaving this branch behind. Rebase the snapshot commit
          # on top of origin/main and push. Bounded retries handle the tiny
          # race window where another push lands mid-rebase.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            echo "Push attempt $attempt failed; rebasing and retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "All 3 push attempts failed — main is changing too quickly."
          exit 1

      - name: Announce new milestones
        # POST the freshly-built snapshot to /api/announce so it diffs against
        # its Upstash baseline and posts any new kills / records / PBs /
        # Resilient tiers to #guild-feed. Passing the file directly (vs a bare
        # GET) means the announce doesn't have to wait for Vercel to redeploy
        # with the new snapshot. Reuses CRON_SECRET (the route accepts it as a
        # fallback). Stays silent until the feed has been seeded once via
        # ?mode=seed. Non-fatal: continue-on-error so a hiccup here never breaks
        # the refresh, and it only runs when the snapshot steps succeeded.
        if: success()
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ ! -f data/snapshot.json ]; then
            echo "No snapshot file; skipping announce."
            exit 0
          fi
          curl --silent --show-error --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @data/snapshot.json \
            -w "\nannounce HTTP %{http_code}\n" \
            "https://lib-site.vercel.app/api/announce" \
            || echo "announce failed (non-fatal)"

      - name: Notify Discord on failure
        # Fires only if any earlier step failed (warmup is continue-on-error
        # so a 504 there doesn't trip this). Posts a link to the failed run
        # so you can pop straight into the log.
        #
        # Setup: create a dedicated Discord webhook on an admin/alerts
        # channel and add it as repo secret DISCORD_WEBHOOK_CRON_ALERT.
        # Without that secret, this step is a no-op (logs and exits).
        if: failure()
        env:
          DISCORD_WEBHOOK_CRON_ALERT: ${{ secrets.DISCORD_WEBHOOK_CRON_ALERT }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_CRON_ALERT" ]; then
            echo "DISCORD_WEBHOOK_CRON_ALERT not configured; skipping Discord notify."
            exit 0
          fi
          LOG_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(jq -n \
            --arg url "$LOG_URL" \
            --arg trigger "${{ github.event_name }}" \
            '{content: ("⚠️ Hourly snapshot refresh failed (\($trigger)). View log: " + $url)}')
          curl --silent --show-error --max-time 30 \
            -X POST "$DISCORD_WEBHOOK_CRON_ALERT" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Discord notify failed (non-fatal)"
