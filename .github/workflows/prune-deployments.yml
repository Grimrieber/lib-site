name: Prune old deployments

# WHY THIS EXISTS
#
# data/snapshot.json is imported at build time (lib/raiderio.ts), so every cron
# data commit forces a full Vercel deploy. Vercel bills Function Storage across
# every RETAINED deployment, and each one carries its own traced copy of the
# dependency tree (the app compiles to ~10 lambdas over a ~470 MB node_modules).
# That is what put the team at 100% of the 10 GB free tier. Five deployments
# accumulated in the 18 hours after the first manual cleanup, so this refills
# in days, not weeks.
#
# Vercel exposes no usage or billing API - the GB figure exists only in the
# dashboard, and the deployment object has no size field. Deployment COUNT is
# the only readable signal, and since storage is roughly count x a constant
# per-deploy size, that is what this watches. Do not go looking for a size
# field; there isn't one.
#
# WHY THE REST API AND NOT THE CLI
#
# `vercel remove` requires a USER-scoped token. A project-scoped token (vcp_...)
# authenticates fine against the REST API but makes the CLI fail with "User not
# found", so a CLI-based job would break the moment the token is a project one.
# Talking to the API directly works with either kind.
#
# The permanent fix is to stop bundling the snapshot and read it at runtime, at
# which point data refreshes stop producing deployments at all.

on:
  schedule:
    # DAILY, 09:40 UTC. Deliberately inside the refresh cron's dead window
    # (09-13 UTC) so a prune never races a snapshot build mid-deploy.
    - cron: "40 9 * * *"
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Prune superseded deployments and report the count
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_j3uXYYLdWjoxpFoYW8BbDaeJZOZl
          TEAM_ID: team_Wms6ArgFJIA1iOFAtPAaoWjI
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not set — skipping."
            echo "Add it at Settings > Secrets and variables > Actions."
            exit 0
          fi

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, urllib.request

          TOKEN = os.environ["VERCEL_TOKEN"]
          PROJECT = os.environ["PROJECT_ID"]
          TEAM = os.environ["TEAM_ID"]
          API = "https://api.vercel.com"

          def call(method, path):
              req = urllib.request.Request(
                  f"{API}{path}", method=method,
                  headers={"Authorization": f"Bearer {TOKEN}"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  body = r.read()
              return json.loads(body) if body else {}

          # WHICH DEPLOYMENTS TO KEEP
          #
          # targets.production.id alone is NOT safe. When a build fails, Vercel
          # still points that at the FAILED deployment - so a prune that trusts
          # it deletes the build actually serving traffic and keeps a broken
          # one. That is exactly what happened on 2026-09-12: a flaky build
          # timed out, the next prune deleted the last working deployment, and
          # the site 404'd for two days.
          #
          # So: keep the production target AND the newest READY deployments,
          # and never delete the last READY one under any circumstances.
          project = call("GET", f"/v9/projects/{PROJECT}?teamId={TEAM}")
          target = (project.get("targets", {}).get("production") or {}).get("id")

          listing = call(
              "GET", f"/v6/deployments?projectId={PROJECT}&teamId={TEAM}&limit=100")
          deployments = listing.get("deployments", [])
          before = len(deployments)

          def is_ready(d):
              return (d.get("readyState") or d.get("state")) == "READY"

          ready = sorted(
              [d for d in deployments if is_ready(d)],
              key=lambda d: d.get("created", 0),
              reverse=True,
          )

          # Three most recent healthy builds stay as rollback targets.
          KEEP_READY = 3
          keep = {d["uid"] for d in ready[:KEEP_READY]}
          if target:
              keep.add(target)

          if not ready:
              print("### Vercel deployment prune" + chr(10))
              print(f"No READY deployment found among {before}; deleted nothing.")
              raise SystemExit(0)

          removed = 0
          for d in deployments:
              uid = d.get("uid")
              if uid in keep:
                  continue
              try:
                  call("DELETE", f"/v13/deployments/{uid}?teamId={TEAM}")
                  removed += 1
              except Exception as e:  # one bad delete must not abort the rest
                  print(f"failed to remove {uid}: {e}")

          after = len(call(
              "GET",
              f"/v6/deployments?projectId={PROJECT}&teamId={TEAM}&limit=100"
          ).get("deployments", []))

          print("### Vercel deployment prune\n")
          print("| | |")
          print("|---|---|")
          print(f"| Before | {before} |")
          print(f"| Removed | {removed} |")
          print(f"| Remaining | {after} |")
          print("")
          print("Keeps the production target plus the newest 3 READY builds. "
                "Vercel exposes no size or usage API, so count is the signal.")

          if after > 20:
              print(f"\n::warning::{after} deployments remain after pruning; "
                    "deploy rate may be outrunning the daily prune.")
          PY

      - name: Confirm the site is still serving
        run: |
          # The prune must never take the site down. Keeping the aliased
          # production deployment should guarantee that, but verify rather than
          # assume: this is a scheduled destructive job running unattended.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                   "https://lib-site.vercel.app/")
          echo "lib-site.vercel.app -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Site is not returning 200 after the prune."
            exit 1
          fi
